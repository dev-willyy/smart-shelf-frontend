<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Scan your product barcode to predict expiry duration" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Shelf - Scan Product</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Load QuaggaJS from CDN for barcode scanning -->
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1>Smart Shelf</h1>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Back Home</a></li>
        </ul>
      </nav>
    </header>

    <main class="scanning-container">
      <section class="card scanner-card">
        <h2>Scan Product Barcode</h2>
        <div id="interactive" class="viewport"></div>
        <canvas id="snapshotCanvas" width="220" height="240"></canvas>
        <p>Detected Barcode: <span id="detectedBarcode">N/A</span></p>
        <div class="button-group">
          <button id="startScannerBtn" class="primary-btn">Start Scanner</button>
          <button id="stopScannerBtn" class="secondary-btn" disabled>Stop Scanner</button>
        </div>
      </section>

      <section class="card conditions-card">
        <h2>Enter Storage Conditions</h2>
        <form id="conditionsForm">
          <label for="tempInput">Temperature (°C):</label>
          <input type="number" id="tempInput" placeholder="e.g., 5" />
          <label for="humidityInput">Humidity (%):</label>
          <input type="number" id="humidityInput" placeholder="e.g., 40" />
          <button type="submit" class="primary-btn">Analyze Spoilage Duration</button>
        </form>
      </section>
    </main>

    <!-- Custom Modal for displaying results -->
    <div id="resultModal" class="modal">
      <div class="modal-content">
        <span id="modalClose" class="close">&times;</span>
        <div id="resultContent"></div>
      </div>
    </div>

    <!-- Finland Defaults Modal -->
    <div id="finlandModal" class="modal">
      <div class="modal-content">
        <span id="finlandModalClose" class="close">&times;</span>
        <h2>Default Finland Storage Conditions</h2>
        <p>We recommend <b>5°C</b> and <b>40%</b> humidity based on typical Finnish conditions.</p>
        <p>Would you like to use these defaults?</p>
        <div class="button-group">
          <button id="acceptDefaultsBtn" class="primary-btn">Accept</button>
          <button id="rejectDefaultsBtn" class="secondary-btn">Reject</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
